name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # All three pinned dependencies resolve anonymously over HTTPS: didwebvh-py and keripy are
      # public upstreams, bakobo-errors is a public Bakobo repo. No App token, no SSH-to-HTTPS
      # rewrite -- which is also item 9 of dev/standards/oss-posture.md holding for a fresh clone
      # by a stranger, not just for us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        # --frozen, so a pyproject/uv.lock divergence fails the job instead of being silently
        # resolved away. Without it CI can pass against a dependency set the lockfile never saw,
        # which for three git-SHA-pinned deps means testing something nobody can reproduce.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Run tests (100% branch coverage gate)
        run: uv run pytest
